<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地采集状态</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #172033;
        background: #edf1f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 336px; }
      main { width: 336px; padding: 14px; }
      h1, h2, p { margin: 0; }
      .masthead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .eyebrow {
        color: #64748b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 { margin-top: 3px; font-size: 18px; letter-spacing: -.02em; }
      #status { margin-top: 4px; color: #526176; font-size: 11px; }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #334155;
        font-size: 12px;
        white-space: nowrap;
      }
      .panel {
        margin-top: 10px;
        border: 1px solid #d7dee8;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(51, 65, 85, .06);
      }
      .diagnostics { overflow: hidden; }
      .diagnostic-row { padding: 10px 12px; border-top: 1px solid #e7ebf0; }
      .diagnostic-row:first-child { border-top: 0; }
      .diagnostic-row strong { display: block; font-size: 12px; font-weight: 700; }
      .meta { margin-top: 4px; color: #68758a; font-size: 10px; line-height: 1.45; overflow-wrap: anywhere; }
      .error { color: #9f2d2d; }
      .connection { padding: 12px; }
      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      h2 { font-size: 13px; }
      #connectionState { color: #526176; font-size: 11px; }
      form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
      label.field { color: #526176; font-size: 11px; }
      input[type="url"], input[type="text"] {
        width: 100%;
        margin-top: 5px;
        border: 1px solid #c8d1dc;
        border-radius: 6px;
        background: #f8fafc;
        padding: 7px 8px;
        color: #172033;
        font: inherit;
        outline: none;
      }
      input:focus { border-color: #526176; box-shadow: 0 0 0 2px rgba(82, 97, 118, .13); }
      button {
        align-self: end;
        border: 0;
        border-radius: 6px;
        background: #172033;
        padding: 8px 11px;
        color: #fff;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, opacity 160ms ease;
      }
      button:disabled { cursor: wait; opacity: .5; }
      button:active, button.is-pressed { background: #64748b; }
      #actionResult { min-height: 16px; margin-top: 7px; color: #526176; font-size: 11px; }
      details { margin-top: 10px; }
      summary { color: #64748b; font-size: 11px; cursor: pointer; }
      details .field { display: block; margin-top: 8px; }
      .characterization { padding: 12px; }
      .characterization .section-heading { margin-bottom: 8px; }
      .characterization .diagnostic-row { padding: 0; border: none; }
      .characterization .diagnostic-row button { margin-right: 6px; }
      .characterization .meta { margin-bottom: 8px; }
      .characterization-info { color: #68758a; font-size: 10px; }
    </style>
  </head>
  <body>
    <main>
      <header class="masthead">
        <div>
          <p class="eyebrow">Unified OJ Capture</p>
          <h1>本地采集状态</h1>
          <p id="status">正在读取…</p>
        </div>
        <label class="switch">
          <input id="captureEnabled" type="checkbox" />
          <span>启用</span>
        </label>
      </header>

      <section class="panel diagnostics" aria-label="采集诊断">
        <div class="diagnostic-row"><strong id="pendingState">等待判题 0</strong></div>
        <div class="diagnostic-row"><strong id="transitionState">网络确认采集尚未启用</strong></div>
        <div class="diagnostic-row"><strong id="outboxState">待同步结果 0</strong></div>
        <div class="diagnostic-row">
          <strong id="quarantineState">已隔离结果 0</strong>
          <p class="meta" id="quarantineDetails"></p>
        </div>
        <div class="diagnostic-row">
          <strong id="lastDelivery">最近送达：暂无</strong>
        </div>
        <div class="diagnostic-row"><strong id="migrationState">正在检查旧记录…</strong></div>
        <div class="diagnostic-row"><strong id="recoveryState">采集恢复：恢复中</strong></div>
        <div class="diagnostic-row"><strong class="error" id="lastError">阻塞原因：无</strong></div>
        <div class="diagnostic-row">
          <button id="recoverCapture" type="button">恢复采集</button>
          <button id="retryAll" type="button">再次同步</button>
          <button id="clearOutbox" type="button">清空待同步结果</button>
          <button id="clearQuarantine" type="button">清空隔离区</button>
          <p id="actionResult" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="panel connection" aria-labelledby="connectionHeading">
        <div class="section-heading">
          <h2 id="connectionHeading">本地连接</h2>
          <p id="connectionState">需要从本地设置页连接</p>
        </div>
        <p class="meta">连接密钥只在扩展与本机应用之间传递，页面不会读取或显示。</p>
        <button id="openConnectionSettings" type="button">打开本地设置页</button>
      </section>

      <section class="panel" aria-labelledby="endpointHeading">
        <div class="section-heading">
          <h2 id="endpointHeading">本地接收地址</h2>
          <p id="captureEndpoint">本地接收地址：http://localhost:3000/api/capture/attempts</p>
        </div>
        <button id="resetCaptureEndpoint" type="button">恢复默认地址</button>
      </section>

      <section class="panel characterization" aria-labelledby="characterizationHeading">
        <div class="section-heading">
          <h2 id="characterizationHeading">NowCoder 诊断</h2>
          <p id="characterizationState">诊断模式未启用</p>
        </div>
        <p class="meta" id="characterizationInfo">仅记录所选 NowCoder 主机的网络请求元数据，5分钟自动过期</p>
        <label class="field" for="characterizationHostname">
          目标主机
          <select id="characterizationHostname">
            <option value="www.nowcoder.com">www.nowcoder.com</option>
            <option value="ac.nowcoder.com">ac.nowcoder.com</option>
            <option value="leetcode.cn">leetcode.cn</option>
            <option value="leetcode.com">leetcode.com</option>
            <option value="atcoder.jp">atcoder.jp</option>
            <option value="codeforces.com">codeforces.com</option>
            <option value="www.luogu.com.cn">www.luogu.com.cn</option>
          </select>
        </label>
        <label class="field" for="characterizationAuthenticated">
          <input id="characterizationAuthenticated" type="checkbox" /> 当前页面已登录
        </label>
        <div class="diagnostic-row">
          <button id="characterizationStart" type="button">开始诊断</button>
          <button id="characterizationStop" type="button" disabled>停止诊断</button>
          <button id="characterizationExport" type="button" disabled>导出记录</button>
        </div>
        <p class="meta" id="characterizationWitnessState">导航见证: 待命中</p>
        <p id="characterizationResult" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
