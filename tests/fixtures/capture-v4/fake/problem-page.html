<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Capture V4 Fake OJ · Problem</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #1f1f1f;
      }
      .fake-oj-shell {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        background: #ffffff;
      }
      .fake-oj-shell h1 {
        font-size: 18px;
        margin: 0 0 12px 0;
      }
      .fake-oj-shell p {
        margin: 0 0 12px 0;
        line-height: 1.45;
      }
      .fake-oj-shell button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .fake-oj-status {
        margin-top: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        background: #f0f4ff;
        color: #1f2a4d;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="fake-oj-shell">
      <h1>Fake OJ · Problem</h1>
      <p>This page is part of the Phase A Task A9 Fake OJ matrix. No real OJ
         endpoint is contacted; every fetch is fulfilled locally by the test
         infrastructure. The page exposes a synthetic submission button and a
         status region for the spec to poll.</p>
      <form id="fake-oj-form" action="" method="post">
        <button type="button" id="fake-oj-submit">Run synthetic submission</button>
      </form>
      <div id="fake-oj-status" class="fake-oj-status">ready</div>
    </main>
  </body>
</html>
