name: Quality Gate

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

# No artifact upload, no OJ, no AI, no external network.
# Local-only gate mirrors `npm run quality:gate` exactly.
jobs:
  quality-gate:
    name: quality-gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install dependencies
        run: npm install

      - name: Run quality gate
        run: npm run quality:gate
